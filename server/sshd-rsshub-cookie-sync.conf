# The account is usable only with a public key installed by
# provision-ssh-key.sh.  The per-key `restrict` and forced command provide the
# final command-level boundary.
Match User rsshub-sync
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication yes
    AuthenticationMethods publickey
    ForceCommand sudo -n /usr/local/sbin/rsshub-cookie-sync-apply
    AuthorizedKeysFile /var/lib/rsshub-sync/.ssh/authorized_keys
    PermitTTY no
    AllowTcpForwarding no
    AllowAgentForwarding no
    X11Forwarding no
Match all
