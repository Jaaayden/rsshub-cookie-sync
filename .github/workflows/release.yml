name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rsshub-cookie-sync-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build and verify release assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed only to sign build provenance for tagged releases.
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install lint tools
        run: |
          python3 -m pip install -r requirements-dev.txt
          npm ci --prefix extension

      - name: Validate release entrypoints and scan for secrets
        run: python3 scripts/check-repo-hygiene.py

      - name: Test the tagged source
        run: make check

      - name: Match tag to extension version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          manifest_version=$(python3 -c 'import json; print(json.load(open("extension/manifest.json", encoding="utf-8"))["version"])')
          test "v${manifest_version}" = "$GITHUB_REF_NAME"

      - name: Package release assets
        run: ./scripts/build-release-assets.sh dist/release-assets

      - name: Attest build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release-assets/*

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rsshub-cookie-sync-release-assets
          path: dist/release-assets/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Validate semantic version tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Download verified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rsshub-cookie-sync-release-assets
          path: dist/release-assets

      - name: Verify downloaded release assets
        working-directory: dist/release-assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          expected = {
              "SHA256SUMS",
              "install-macos.sh",
              "install-server.sh",
              "rsshub-cookie-sync-extension.zip",
              "rsshub-cookie-sync-source.tar.gz",
              "uninstall-macos.sh",
              "uninstall-server.sh",
          }
          actual = {path.name for path in Path(".").iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(f"unexpected downloaded assets: {sorted(actual)}")
          PY
          sha256sum -c SHA256SUMS

      # Published assets are never overwritten: the checksums and the
      # installers' trust in them rely on a release not changing after the fact.
      - name: Attach release assets to the tagged GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets=(
            dist/release-assets/rsshub-cookie-sync-extension.zip
            dist/release-assets/rsshub-cookie-sync-source.tar.gz
            dist/release-assets/install-server.sh
            dist/release-assets/install-macos.sh
            dist/release-assets/uninstall-server.sh
            dist/release-assets/uninstall-macos.sh
            dist/release-assets/SHA256SUMS
          )
          if gh release view "$GITHUB_REF_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to overwrite its assets." >&2
            echo "Publish a new patch version instead." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            "${assets[@]}" \
            --repo "$GH_REPO" \
            --verify-tag \
            --generate-notes
