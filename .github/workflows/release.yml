name: Package extension

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build Edge extension archive
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Test the tagged source
        run: make check

      - name: Package extension
        run: ./scripts/package-extension.sh dist/rsshub-cookie-sync-extension.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rsshub-cookie-sync-extension
          path: dist/rsshub-cookie-sync-extension.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish tagged extension archive
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Validate semantic version tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Rebuild extension archive from the tagged source
        run: ./scripts/package-extension.sh dist/rsshub-cookie-sync-extension.zip

      - name: Attach archive to an immutable tagged GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/rsshub-cookie-sync-extension.zip
          else
            gh release create "$GITHUB_REF_NAME" dist/rsshub-cookie-sync-extension.zip --generate-notes
          fi
