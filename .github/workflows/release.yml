name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rsshub-cookie-sync-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build and verify release assets
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Validate release entrypoints
        shell: bash
        run: |
          set -euo pipefail

          release_scripts=(
            scripts/install-server.sh
            scripts/install-macos.sh
            scripts/uninstall-macos.sh
            server/uninstall.sh
          )

          for script in "${release_scripts[@]}"; do
            test -f "$script"
            test ! -L "$script"
            test -x "$script"
            sh -n "$script"
          done

          python3 - <<'PY'
          import re
          from pathlib import Path

          paths = [
              path
              for root in (Path("."), Path("extension"), Path("native-host"), Path("server"), Path("scripts"))
              for path in root.glob("*")
              if path.is_file() and path.name not in {"LICENSE"}
          ]
          ipv4 = re.compile(r"(?<![0-9.])(?:[0-9]{1,3}\.){3}[0-9]{1,3}(?![0-9.])")
          private_key = re.compile(r"-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----")
          bark_key_url = re.compile(r"https?://api\.day\.app/[A-Za-z0-9._~-]{16,}")
          secret_assignment = re.compile(
              r"^\s*(?:export\s+)?(?:ZHIHU_COOKIES|WEIBO_COOKIES|TWITTER_AUTH_TOKEN|"
              r"BARK_DEVICE_KEY|BARK_KEY|DEVICE_KEY)"
              r"\s*=\s*(?P<value>.+?)\s*$"
          )
          allowed_ips = {"127.0.0.1"}

          errors = []
          for path in paths:
              if path.is_symlink() or not path.is_file():
                  errors.append(f"{path}: release entrypoint must be a regular file")
                  continue
              source = path.read_text(encoding="utf-8")
              for address in ipv4.findall(source):
                  if address not in allowed_ips:
                      errors.append(f"{path}: machine-specific IPv4 literal {address}")
              if private_key.search(source) and not path.name.startswith("test_"):
                  errors.append(f"{path}: private key material is embedded")
              if bark_key_url.search(source):
                  errors.append(f"{path}: Bark device key is embedded in a URL")
              for number, line in enumerate(source.splitlines(), 1):
                  match = secret_assignment.match(line)
                  if not match:
                      continue
                  value = match.group("value").strip()
                  if value not in {'""', "''"} and not value.startswith(("$", '"$', "'$")):
                      errors.append(f"{path}:{number}: literal secret assignment")

          if errors:
              raise SystemExit("\n".join(errors))
          PY

      - name: Test the tagged source
        run: make check

      - name: Match tag to extension version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          manifest_version=$(python3 -c 'import json; print(json.load(open("extension/manifest.json", encoding="utf-8"))["version"])')
          test "v${manifest_version}" = "$GITHUB_REF_NAME"

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          release_dir=dist/release-assets
          rm -rf "$release_dir"
          mkdir -p "$release_dir"
          ./scripts/package-extension.sh "$release_dir/rsshub-cookie-sync-extension.zip"
          cp scripts/install-server.sh "$release_dir/install-server.sh"
          cp scripts/install-macos.sh "$release_dir/install-macos.sh"
          cp server/uninstall.sh "$release_dir/uninstall-server.sh"
          cp scripts/uninstall-macos.sh "$release_dir/uninstall-macos.sh"
          chmod 0755 \
            "$release_dir/install-server.sh" \
            "$release_dir/install-macos.sh" \
            "$release_dir/uninstall-server.sh" \
            "$release_dir/uninstall-macos.sh"
          (
            cd "$release_dir"
            sha256sum \
              rsshub-cookie-sync-extension.zip \
              install-server.sh \
              install-macos.sh \
              uninstall-server.sh \
              uninstall-macos.sh > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

          python3 - <<'PY'
          import re
          import json
          import zipfile
          from pathlib import Path

          release_dir = Path("dist/release-assets")
          expected_assets = {
              "rsshub-cookie-sync-extension.zip",
              "install-server.sh",
              "install-macos.sh",
              "uninstall-server.sh",
              "uninstall-macos.sh",
              "SHA256SUMS",
          }
          actual_assets = {path.name for path in release_dir.iterdir() if path.is_file()}
          if actual_assets != expected_assets:
              raise SystemExit(f"unexpected release assets: {sorted(actual_assets)}")

          manifest = json.loads(Path("extension/manifest.json").read_text(encoding="utf-8"))
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", str(manifest.get("version", ""))):
              raise SystemExit(f"invalid extension version: {manifest.get('version')!r}")

          expected_extension = {
              "background.js",
              "lib/cookies.js",
              "lib/native-config.js",
              "lib/popup-actions.js",
              "lib/protocol.js",
              "lib/state.js",
              "manifest.json",
              "options.css",
              "options.html",
              "options.js",
              "popup.css",
              "popup.html",
              "popup.js",
          }
          with zipfile.ZipFile(release_dir / "rsshub-cookie-sync-extension.zip") as archive:
              actual_extension = set(archive.namelist())
          if actual_extension != expected_extension:
              raise SystemExit(
                  f"unexpected extension archive entries: {sorted(actual_extension)}"
              )
          PY

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rsshub-cookie-sync-release-assets
          path: dist/release-assets/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Validate semantic version tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Download verified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rsshub-cookie-sync-release-assets
          path: dist/release-assets

      - name: Verify downloaded release assets
        working-directory: dist/release-assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          expected = {
              "SHA256SUMS",
              "install-macos.sh",
              "install-server.sh",
              "rsshub-cookie-sync-extension.zip",
              "uninstall-macos.sh",
              "uninstall-server.sh",
          }
          actual = {path.name for path in Path(".").iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(f"unexpected downloaded assets: {sorted(actual)}")
          PY
          sha256sum -c SHA256SUMS

      - name: Attach release assets to the tagged GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=(
            dist/release-assets/rsshub-cookie-sync-extension.zip
            dist/release-assets/install-server.sh
            dist/release-assets/install-macos.sh
            dist/release-assets/uninstall-server.sh
            dist/release-assets/uninstall-macos.sh
            dist/release-assets/SHA256SUMS
          )
          if gh release view "$GITHUB_REF_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "${assets[@]}" \
              --repo "$GH_REPO" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "${assets[@]}" \
              --repo "$GH_REPO" \
              --verify-tag \
              --generate-notes
          fi
