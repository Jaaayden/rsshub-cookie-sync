name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rsshub-cookie-sync-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build and verify release assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed only to sign build provenance for tagged releases.
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install lint tools
        run: |
          python3 -m pip install -r requirements-dev.txt
          npm ci --prefix extension

      - name: Validate release entrypoints and scan for secrets
        run: python3 scripts/check-repo-hygiene.py

      - name: Test the tagged source
        run: make check

      - name: Match tag to extension version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          manifest_version=$(python3 -c 'import json; print(json.load(open("extension/manifest.json", encoding="utf-8"))["version"])')
          test "v${manifest_version}" = "$GITHUB_REF_NAME"

      - name: Package release assets
        run: ./scripts/build-release-assets.sh dist/release-assets

      - name: Attest build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release-assets/*

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rsshub-cookie-sync-release-assets
          path: dist/release-assets/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Validate semantic version tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Download verified release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rsshub-cookie-sync-release-assets
          path: dist/release-assets

      - name: Verify downloaded release assets
        working-directory: dist/release-assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          expected = {
              "SHA256SUMS",
              "install-macos.sh",
              "install-server.sh",
              "rsshub-cookie-sync-extension.zip",
              "rsshub-cookie-sync-source.tar.gz",
              "uninstall-macos.sh",
              "uninstall-server.sh",
          }
          actual = {path.name for path in Path(".").iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(f"unexpected downloaded assets: {sorted(actual)}")
          PY
          sha256sum -c SHA256SUMS

      # Published assets are never overwritten: the checksums and the
      # installers' trust in them rely on a release not changing after the fact.
      - name: Attach release assets to the tagged GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets=(
            dist/release-assets/rsshub-cookie-sync-extension.zip
            dist/release-assets/rsshub-cookie-sync-source.tar.gz
            dist/release-assets/install-server.sh
            dist/release-assets/install-macos.sh
            dist/release-assets/uninstall-server.sh
            dist/release-assets/uninstall-macos.sh
            dist/release-assets/SHA256SUMS
          )
          if gh release view "$GITHUB_REF_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to overwrite its assets." >&2
            echo "Publish a new patch version instead." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            "${assets[@]}" \
            --repo "$GH_REPO" \
            --verify-tag \
            --generate-notes
