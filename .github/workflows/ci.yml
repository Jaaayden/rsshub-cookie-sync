name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / Node.js 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The server and Native Messaging Host support Python 3.9+.
        python-version: ['3.9', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the complete test suite
        run: make check

      - name: Verify extension packaging
        run: ./scripts/package-extension.sh dist/rsshub-cookie-sync-extension.zip

      - name: Check packaged files
        working-directory: dist
        run: |
          unzip -Z1 rsshub-cookie-sync-extension.zip | grep -Fx 'manifest.json'
          diff -u <(printf '%s\n' \
            background.js \
            lib/cookies.js \
            lib/popup-actions.js \
            lib/protocol.js \
            lib/state.js \
            manifest.json \
            popup.css \
            popup.html \
            popup.js) \
            <(unzip -Z1 rsshub-cookie-sync-extension.zip | LC_ALL=C sort)
