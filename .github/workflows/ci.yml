name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} / Node.js 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The server and Native Messaging Host support Python 3.9+.  The
        # Native Host and its installer target macOS, so it is tested there too.
        include:
          - os: ubuntu-latest
            python-version: '3.9'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.13'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lint tools
        run: |
          python3 -m pip install -r requirements-dev.txt
          npm ci --prefix extension

      # Release entrypoints are public source.  Keep deployment-specific
      # addresses and credentials out of every tracked file.
      - name: Validate release entrypoints and scan for secrets
        run: python3 scripts/check-repo-hygiene.py

      - name: Run the complete test suite
        run: make check

      - name: Build and verify release assets
        if: runner.os == 'Linux'
        run: ./scripts/build-release-assets.sh dist/release-assets
