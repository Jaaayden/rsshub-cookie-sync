name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} / Node.js 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The server and Native Messaging Host support Python 3.9+.  The
        # Native Host and its installer target macOS, so it is tested there too.
        include:
          - os: ubuntu-latest
            python-version: '3.9'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.13'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lint tools
        run: |
          python3 -m pip install -r requirements-dev.txt
          npm ci --prefix extension

      # Release entrypoints are public source.  Keep deployment-specific
      # addresses and credentials out of every tracked file.
      - name: Validate release entrypoints and scan for secrets
        run: python3 scripts/check-repo-hygiene.py

      - name: Run the complete test suite
        run: make check

      - name: Build and verify release assets
        if: runner.os == 'Linux'
        run: ./scripts/build-release-assets.sh dist/release-assets
